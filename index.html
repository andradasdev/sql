<style>
  /* Paleta da for_code */
  :root {
    --roxo-escuro: #1E1647;
    --roxo-claro:  #614AD3;
    --amarelo:     #FFFF00;
    --fundo:       #f4f4f7;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--fundo);
    color: var(--roxo-escuro);
    font-family: "Lexend", -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    gap: .75rem 1rem;
    align-items: center;
    justify-content: space-between;
    padding: .75rem 1.25rem;
    background: var(--roxo-escuro);
    color: #fff;
    border-bottom: 3px solid var(--roxo-claro);
    position: relative;
    z-index: 2;
  }
  header .titulo { display: flex; flex-direction: column; gap: .1rem; }
  header .marca { font-size: .75rem; font-weight: 700; letter-spacing: .12em; color: var(--amarelo); }
  header h1 { margin: 0; font-size: 1rem; font-weight: 600; line-height: 1.3; }
  header .acoes { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  header a, header button, header summary {
    display: inline-block;
    padding: .4rem .85rem;
    border-radius: 999px;
    font: inherit;
    font-size: .85rem;
    font-weight: 600;
    text-decoration: none;
    color: #fff;
    background: transparent;
    border: 1px solid rgba(255,255,255,.45);
    cursor: pointer;
  }
  header a:hover, header a:focus-visible,
  header button:hover, header button:focus-visible,
  header summary:hover, header summary:focus-visible { background: var(--roxo-claro); border-color: var(--roxo-claro); }
  header a.primario { background: var(--amarelo); border-color: var(--amarelo); color: var(--roxo-escuro); }
  header a.primario:hover, header a.primario:focus-visible { background: #fff; border-color: #fff; }
  header button[aria-pressed="true"] { background: rgba(255,255,255,.16); border-color: #fff; }

  /* Menu de materiais: um <details> que abre uma lista sob o botão */
  .menu { position: relative; }
  .menu summary { list-style: none; }
  .menu summary::-webkit-details-marker { display: none; }
  .menu summary::after { content: " ▾"; }
  .menu[open] summary { background: var(--roxo-claro); border-color: var(--roxo-claro); }
  .menu .lista {
    position: absolute;
    right: 0;
    top: calc(100% + .4rem);
    display: flex;
    flex-direction: column;
    gap: .35rem;
    padding: .5rem;
    min-width: 14rem;
    background: var(--roxo-escuro);
    border: 1px solid var(--roxo-claro);
    border-radius: .75rem;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
  }
  .menu .lista a { border-radius: .5rem; }

  main { flex: 1 1 auto; min-height: 0; }
  object { width: 100%; height: 100%; border: none; display: block; }

  /* Só aparece se o navegador não conseguir embutir o PDF (iOS, alguns
     navegadores móveis). Fica DENTRO do <object>, como conteúdo alternativo. */
  .fallback {
    max-width: 34rem;
    margin: 3rem auto;
    padding: 0 1.5rem;
    text-align: center;
    line-height: 1.6;
  }
  .fallback a { color: var(--roxo-claro); font-weight: 600; }
</style>
</head>
<body>

<header>
  <div class="titulo">
    <span class="marca">FOR_CODE · MYSQL · SQL</span>
    <h1>Capacitação de MySQL e SQL</h1>
  </div>
  <nav class="acoes">
    <a class="primario" href="./docs/guia.pdf" download>Baixar o guia</a>
    <button type="button" data-pdf="./docs/guia.pdf" aria-pressed="true">Ver guia</button>
    <button type="button" data-pdf="./docs/apresentacao.pdf" aria-pressed="false">Ver slides</button>
    <a href="./materials/liga.sql" download>Script da aula (.sql)</a>
    <a href="https://github.com/ronidomingues/mysql-training">Código-fonte</a>
  </nav>
</header>

<main id="visor">
  <object data="./docs/guia.pdf" type="application/pdf">
    <div class="fallback">
      <p>Seu navegador não consegue exibir o PDF nesta página.</p>
      <p><a href="./docs/guia.pdf">Abrir o guia</a> · <a href="./docs/apresentacao.pdf">Abrir os slides</a></p>
    </div>
  </object>
</main>

<script>
  // Troca o PDF exibido. O <object> é recriado porque alguns navegadores
  // ignoram a mudança do atributo "data" depois que o PDF já carregou.
  const visor = document.getElementById('visor');
  const botoes = document.querySelectorAll('button[data-pdf]');
  botoes.forEach(botao => botao.addEventListener('click', () => {
    const atual = visor.querySelector('object');
    const novo = atual.cloneNode(true);
    novo.data = botao.dataset.pdf;
    atual.replaceWith(novo);
    botoes.forEach(b => b.setAttribute('aria-pressed', String(b === botao)));
  }));

  // Fecha o menu de materiais ao clicar fora dele.
  document.addEventListener('click', evento => {
    document.querySelectorAll('details.menu[open]').forEach(menu => {
      if (!menu.contains(evento.target)) menu.removeAttribute('open');
    });
  });
</script>

</body>
</html>
